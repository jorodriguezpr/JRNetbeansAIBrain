OpenIDE-Module-Name=JR NetBeans AI Brain
OpenIDE-Module-Display-Category=Editing
OpenIDE-Module-Short-Description=AI coding agent for NetBeans: Chat, Plan and Agent modes with Ollama Cloud, local Ollama, Claude, OpenAI, Gemini, the jrbtbrain bridge or the Copilot app.
OpenIDE-Module-Long-Description=\
    An AI agent in a chat window that works on your project like a developer: it explores the whole \
    project, creates and edits files (with a diff preview you accept or reject), runs artisan, composer, \
    npm and tests, and creates complete new Laravel or PHP projects from a description. It detects the \
    project type (Laravel, PHP, WordPress, Symfony, Node, Maven...). Chat, Plan and Agent modes. AI providers: \
    Ollama Cloud, local Ollama, the jrbtbrain bridge, Claude, OpenAI, Gemini, any OpenAI-compatible server, \
    or the Copilot app. Tools > AI Brain, Window > AI Brain or Ctrl+Alt+Shift+B. \
    Developer: Jose Rodriguez Arroyo - https://microrepair.net
Menu/Tools/JRAIBrain=AI Brain
